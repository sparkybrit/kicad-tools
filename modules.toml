# The Sparky1 modules, one table each. The table name is the symbol name in
# sparky1_modules.kicad_sym and the stem of its file in interfaces/.
#
#   description  one line, copied into the symbol's Description
#   repo         where the module's own KiCad project lives
#   schematic    its top-level schematic, relative to that repo's root
#   connectors   the references of the connectors that make up its interface,
#                in unit order (unit A is the first)
#   names        optional {connector = text} shown inside each unit

[SRAM_ADAPTER]
description = "8 MB SRAM breadboard adapter: eight LY62W10248 (1M x 8) in two banks of four. J0 address and control, J1 data"
repo = "https://github.com/sparkybrit/sram-breadboard-adapter"
schematic = "sram-breadboard-adaptor.kicad_sch"
connectors = ["J0", "J1"]
names = { J0 = "J0 address, control", J1 = "J1 data" }

[CPU_ADAPTER]
description = "MC68030 PGA-to-breadboard adapter, v1.0. J1 address, J2 data, J3 and J4 control (bus arbitration, sizing, cache, interrupts)"
repo = "https://github.com/sparkybrit/68030-breadboard-adapter"
schematic = "68030-breadboard.kicad_sch"
connectors = ["J1", "J2", "J3", "J4"]
names = { J1 = "J1 address", J2 = "J2 data", J3 = "J3 control", J4 = "J4 control" }

[BUSDECODER]
description = "busdecoder, ATF22V10C: address decode, chip selects, /CIIN, /IACK, /DSACK0 and /DSACK1"
repo = "https://github.com/sparkybrit/sparky1"
pld = "plds/busdecoder/busdecoder.pld"
connectors = ["DIP24"]
names = { DIP24 = "busdecoder, 22V10" }
reference = "U"

[SRAMMANAGER]
description = "srammanager, ATF22V10C: the eight SRAM chip selects /CSA0-/CSB3, from /SRAMCS, A22, A1, A0, SIZ1, SIZ0, R/W and /DS"
repo = "https://github.com/sparkybrit/sparky1"
pld = "plds/srammanager/srammanager.pld"
connectors = ["DIP24"]
names = { DIP24 = "srammanager, 22V10" }
reference = "U"

[CFMANAGER]
description = "cfmanager, ATF22V10C: CompactFlash wait states, /IORD and /IOWR, its /DSACK0 and /DSACK1, and -CS1"
repo = "https://github.com/sparkybrit/sparky1"
pld = "plds/cfmanager/cfmanager.pld"
connectors = ["DIP24"]
names = { DIP24 = "cfmanager, 22V10" }
reference = "U"

[BOOT]
description = "boot, ATF16V8C: /BOOT through /RESET and the first 8 completed bus cycles after it"
repo = "https://github.com/sparkybrit/sparky1"
pld = "plds/boot/boot.pld"
connectors = ["DIP20"]
names = { DIP20 = "boot, 16V8" }
reference = "U"

[WATCHDOG]
description = "watchdog, ATF16V8C-7: /BERR 64 clocks into a bus cycle nothing has answered"
repo = "https://github.com/sparkybrit/sparky1"
pld = "plds/watchdog/watchdog.pld"
connectors = ["DIP20"]
names = { DIP20 = "watchdog, 16V8" }
reference = "U"

[CF_ADAPTER]
description = "50-pin CompactFlash breadboard adapter (bought in), the card in True IDE mode. Pins numbered as the CF connector's"
repo = "https://github.com/sparkybrit/sparky1-modules"
pins = "sources/CF_ADAPTER.pins"
connectors = ["CF"]
names = { CF = "CompactFlash, True IDE" }

[NVRAM_PROGRAMMER]
description = "In-circuit NVRAM programmer, Teensy++ 2.0: takes the bus with /BR, /BG, /BGACK and writes the DS1250. Pins numbered by Teensy port name"
repo = "https://github.com/sparkybrit/nvram-programmer"
pins = "sources/NVRAM_PROGRAMMER.pins"
connectors = ["TEENSY"]
names = { TEENSY = "nvram-programmer, Teensy++ 2.0" }
